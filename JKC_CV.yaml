        position: Student Outreach Instructor
        location: Tokyo, Japan
        date: 2026
        highlights:
          - Led an outreach session on creativity, LLM-supported idea evaluation, and EEG as a method for studying brain activity.
      - company: KU Leuven
        position: R Programming Teaching Assistant
        location: Leuven, Belgium
        date: 2024
        highlights:
          - Taught introductory R programming and statistics concepts to audiology students.
      - company: University of Rochester
        position: Biomaterials Teaching Assistant
        location: Rochester, New York
