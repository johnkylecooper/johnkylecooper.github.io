  sections:
    Professional Summary:
      - Researcher and builder of experimental and interactive systems, with experience in eye tracking, EEG, Unity, VR, and research software. I combine experimental design, programming, and data analysis to study human perception and creative problem solving.
    Education:
      - institution: KU Leuven
        area: Biomedical Sciences
        degree: PhD
        location: Leuven, Belgium
        start_date: 2021-10
        end_date: 2025-10
      - institution: University of Rochester
        area: Biomedical Engineering
        degree: MSc
        location: Rochester, New York
        start_date: 2019-08
        end_date: 2021-05
      - institution: Texas A&M University
        area: Biomedical Engineering
        degree: BSc
        location: College Station, Texas
        start_date: 2015-08
        end_date: 2019-05
        highlights:
          - Germany Biosciences Program, Bonn, Germany
          - Greece Engineering Ethics, Thessaloniki, Greece
    Research and Technical Experience:
      - company: IRCN, The University of Tokyo
        position: Project Researcher (Postdoctoral)
        location: Tokyo, Japan
        start_date: 2025-11
        end_date: 2026-09
        highlights:
          - Designed a creative problem-solving puzzle game and conducted experiments using eye tracking (Tobii) to help trace participants’ thought processes as they worked toward solutions.
          - Explored AI-supported methods for evaluating creative ideas and informing research design.
      - company: KU Leuven
        position: FWO Strategic Basic Research PhD Fellow
        location: Leuven, Belgium
        start_date: 2021-10
        end_date: 2025-10
        highlights:
          - Redesigned a Unity-based audiovisual experiment to study speech perception and human-computer interaction.
          - Built neuroimaging data workflows using Python, MATLAB, R, and scikit-learn to model speech understanding.
      - company: University of Rochester
        position: Research Assistant
        location: Rochester, New York
        start_date: 2019-08
        end_date: 2021-05
        highlights:
          - Built a Python-based audiovisual neuroimaging setup with sub-millisecond video playback timing.
          - Coordinated experimental procedures, participant scheduling, and lab operations for speech perception studies.
      - company: Texas A&M University
        position: Research Assistant
        location: College Station, Texas
        start_date: 2016-08
        end_date: 2019-05
        highlights:
          - Developed an Unreal Engine VR viewer for 3D cochlear scans.
          - Designed and fabricated power supply boxes for optical coherence tomography experiments.
      - company: Lynntech Inc.
        position: Senior Design Team Member
        location: College Station, Texas
        start_date: 2018-08
        end_date: 2019-05
        highlights:
          - Designed and developed an orthotic rehabilitation device prototype.
      - company: Enmodes GmbH
        position: Medical Device Design Collaborator
        location: Aachen, Germany
        start_date: 2017-01
        end_date: 2017-05
        highlights:
          - Modeled a respiratory support device prototype, using Blender for design and visualization.
    Research and Technical Strengths:
      - label: Research Practice
        details: Problem framing, experimental design, human-subject research, scientific writing
      - label: Programming and Analysis
        details: Python, MATLAB, R, and JavaScript for research data analysis, automation, scripting, and experimental workflows
      - label: Experimental Systems
        details: Audiovisual tasks, stimulus workflows, EEG systems, eye tracking (Tobii), Unity and VR environments
      - label: AI-Assisted Development
        details: Codex and OpenCode for prototyping, coding support, requirements documentation, and context management
      - label: Collaboration
        details: Cross-disciplinary teams, participant studies, technical documentation, presentations
    Selected Publications:
      - title: Objectively measuring audiovisual effects in noise using virtual human speakers
        authors:
          - J. K. Cooper
          - J. Vanthornhout
          - A. van Wieringen
          - T. Francart
        doi: https://doi.org/10.1177/23312165251333528
        journal: Trends in Hearing
        date: 2025-04
      - title: Neural Tracking of Audiovisual Effects in Noise Using Deep Neural Network-Generated Virtual Humans
        authors:
          - J. K. Cooper
          - J. Vanthornhout
          - A. van Wieringen
          - T. Francart
        doi: https://doi.org/10.1101/2025.06.02.656280
        journal: bioRxiv
        date: 2025-06
      - title: Large-scale multi-site study shows no association between musical training and early auditory neural sound encoding
        authors:
          - K. L. Whiteford
          - ...
          - J. K. Cooper
          - ...
          - A. J. Oxenham
        doi: https://doi.org/10.1038/s41467-025-62155-5
        journal: Nature Communications
        date: 2025-08
